name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sin secretos ni acceso a la base de datos: solo comprobaciones estáticas y
# tests de lógica pura. Nada de esto necesita tocar Supabase.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` ejecuta `prisma generate`, que solo lee el esquema.
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
